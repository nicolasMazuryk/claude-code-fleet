# cc-orchestrator: Mac sshd = public keys only, user nicolas only (Phase 6, phone → Mac over Tailscale).
# Installed as /etc/ssh/sshd_config.d/100-keys-only.conf by `sudo mac-remote-access apply` (backup first, `sshd -t`
# checked). sshd keeps the first value it reads; this file sorts before Apple's 100-macos.conf.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
AllowUsers nicolas
