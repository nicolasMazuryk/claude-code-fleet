# /etc/rsyslog.d/30-cc-orchestrator.conf — installed by cc-orchestrator ./install.sh cloud.
# cc-rc@<repo> output and cc-rc@/cc-agents unit events → /var/log/core/agent.log, which oci's unified agent
# (core-uac-cloud) ships to core-log-cloud. oci owns the shipping; cc-orchestrator owns what is written.
if ($programname startswith "cc-rc@") or ($programname == "systemd" and ($msg contains "cc-rc@" or $msg contains "cc-agents")) then /var/log/core/agent.log
