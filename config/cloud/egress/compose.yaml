# Egress gateway (browser-router spec §6, ADR 0007): Browser Use browsers connect to gost on host :8443 (OCI NLB
# core-nlb :8443 → host :8443, source preserved) and leave through the Tailscale exit node the router selects.
# Only this stack's traffic changes route; the rest of the VM keeps direct OCI egress.
# Run by cc-egress.service (config/cloud/systemd) from ~/claude-code-fleet/config/cloud/egress with EGRESS_* set:
#   EGRESS_STATE_DIR   tailscale node state (survives restarts, so the node keeps its identity)
#   EGRESS_SECRETS_DIR holds gost-auth (0400, owner uid 10001: "browseruse <password>") and ts-authkey (0600, may be
#                      empty once the node has joined). Delivered from the Mac by ./install.sh cloud; never in git.
#   EGRESS_SECRETS_DIR/tls cert.pem (0444) + key.pem (0400, uid 10001): the public TLS certificate, pushed by the Mac's
#                      bin/egress-cert-renew; created empty by ./install.sh cloud (gost falls back to self-signed).
name: egress
services:
  tailscale:                      # owns the network namespace; gost and the guard share it
    image: tailscale/tailscale:v1.104.2
    hostname: egress
    restart: unless-stopped
    cap_add: [net_admin, net_raw]
    devices: ["/dev/net/tun:/dev/net/tun"]
    # the shared namespace's own lookups; gost does not use it (its resolver is in gost.yaml: 127.0.0.11 is dropped for its uid)
    dns: [1.1.1.1, 9.9.9.9]
    ports: ["8443:8443"]
    environment:
      TS_HOSTNAME: egress
      TS_STATE_DIR: /var/lib/tailscale
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:egress
    entrypoint: ["/bin/sh", "-c", "export TS_AUTHKEY=\"$$(cat /run/secrets/ts_authkey 2>/dev/null)\"; exec /usr/local/bin/containerboot"]
    secrets: [ts_authkey]
    volumes:
      - ${EGRESS_STATE_DIR:?set EGRESS_STATE_DIR}:/var/lib/tailscale

  guard:                          # nftables + reply routing in the shared namespace; gost starts only once it is healthy
    build: ./guard
    restart: unless-stopped
    network_mode: service:tailscale
    cap_add: [net_admin]
    volumes:
      - ./guard.nft:/etc/guard.nft:ro
      - ./guard.sh:/usr/local/bin/guard.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/guard.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nft list table inet egress_guard >/dev/null && ip rule show | grep -q 'fwmark 0x2/0x2'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  gost:
    image: gogost/gost:3.3.1
    restart: unless-stopped
    network_mode: service:tailscale
    user: "10001:10001"           # the uid the nftables rules match (guard.nft)
    depends_on:
      guard: {condition: service_healthy}
    # gost exits when certFile is missing, so without a readable certificate the entrypoint drops the `tls:` block and
    # gost generates a self-signed one (with a warning in `docker logs`)
    entrypoint:
      - /bin/sh
      - -c
      - |
        c=/etc/gost/gost.yaml
        if [ -r /etc/gost/tls/cert.pem ] && [ -r /etc/gost/tls/key.pem ]; then exec /bin/gost -C $$c; fi
        echo "egress: WARNING no readable TLS certificate in /etc/gost/tls; serving a self-signed one" >&2
        sed '/^    tls:/,/keyFile/d' $$c > /tmp/gost.yaml
        exec /bin/gost -C /tmp/gost.yaml
    volumes:
      - ./gost.yaml:/etc/gost/gost.yaml:ro
      - ${EGRESS_SECRETS_DIR:?set EGRESS_SECRETS_DIR}/tls:/etc/gost/tls:ro   # cert.pem + key.pem (bin/egress-cert-renew)
    secrets:
      - gost_auth

secrets:
  gost_auth:
    file: ${EGRESS_SECRETS_DIR:?set EGRESS_SECRETS_DIR}/gost-auth
  ts_authkey:
    file: ${EGRESS_SECRETS_DIR:?set EGRESS_SECRETS_DIR}/ts-authkey
